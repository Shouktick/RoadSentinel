name: RoadSentinel quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.txt
      - name: Backend tests and lint
        run: |
          .venv/bin/python -m pytest backend/tests -q
          .venv/bin/ruff check backend/app backend/tests backend/scripts
          .venv/bin/ruff format --check backend/app backend/tests backend/scripts
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Frontend quality and build
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run format:check
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile journeys
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
